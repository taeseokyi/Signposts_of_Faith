# main에 push될 때마다 웹사이트를 빌드해 GitHub Pages에 배포한다.
# 빌드: python template/build.py site  (날짜 폴더의 content.md → _site/, 인쇄용 PDF 포함)
name: 웹사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      # 한중일 글꼴 꾸러미 전체(apt fonts-noto-cjk) 대신 한국어 명조 두 파일만 받아 캐시해 둔다.
      - name: 한글 글꼴 캐시
        id: fonts
        uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts/noto-serif-cjk-kr
          key: noto-serif-cjk-kr-v1

      - name: 한글 글꼴 내려받기 (Noto Serif CJK KR)
        if: steps.fonts.outputs.cache-hit != 'true'
        run: |
          dir=~/.local/share/fonts/noto-serif-cjk-kr
          mkdir -p "$dir"
          for w in Regular Bold; do
            curl -fsSL --retry 3 -o "$dir/NotoSerifCJKkr-$w.otf" \
              "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Serif/OTF/Korean/NotoSerifCJKkr-$w.otf"
          done

      - name: 한글 글꼴 등록
        run: |
          fc-cache -f ~/.local/share/fonts
          fc-list | grep -q "Noto Serif CJK KR" || { echo "Noto Serif CJK KR 글꼴이 없습니다"; exit 1; }

      - name: 파이썬 패키지 설치
        run: pip install -r requirements.txt

      - name: 웹사이트 빌드
        run: python template/build.py site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
